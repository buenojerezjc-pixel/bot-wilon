<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Escanear QR Evolution API</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #f0f2f5; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 350px; }
        img { width: 250px; height: 250px; border: 1px solid #ddd; border-radius: 8px; margin: 15px 0; }
        button { background: #25D366; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; }
        button:hover { background: #1ebc57; }
    </style>
</head>
<body>

<div class="card">
    <h2>Escanear QR de WhatsApp</h2>
    <p>Instancia: <b>wilon_bot</b></p>
    <img id="qrImage" src="" alt="Cargando QR...">
    <br>
    <button onclick="cargarQR()">🔄 Generar Nuevo QR</button>
</div>

<script>
    async function cargarQR() {
        const img = document.getElementById('qrImage');
        img.alt = "Obteniendo QR...";
        try {
            const res = await fetch('https://evolution-api-latest-bkbs.onrender.com/instance/connect/wilon_bot', {
                headers: { 'apikey': '123456' }
            });
            const data = await res.json();
            
            if (data.base64) {
                img.src = data.base64;
            } else if (data.code) {
                img.src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(data.code)}`;
            } else if (data.instance && data.instance.state === 'open') {
                alert('¡La sesión ya está conectada y abierta!');
            } else {
                alert('Esperando respuesta del servidor...');
            }
        } catch (e) {
            console.error(e);
            alert('Error conectando con Evolution API');
        }
    }

    // Cargar automáticamente al abrir
    cargarQR();
</script>

</body>
</html>
