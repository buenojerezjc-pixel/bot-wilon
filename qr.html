<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conectar Wilon a WhatsApp</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h2 { margin-bottom: 1.5rem; color: #38bdf8; }
        button {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }
        button:hover { background-color: #059669; }
        button:disabled { background-color: #64748b; cursor: not-allowed; }
        #qr-container {
            margin-top: 1.5rem;
            min-height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        img {
            max-width: 250px;
            border-radius: 8px;
            border: 4px solid #38bdf8;
        }
        .status { margin-top: 10px; font-size: 0.9rem; color: #94a3b8; }
    </style>
</head>
<body>

<div class="card">
    <h2>Vinculación Wilon WhatsApp 📲</h2>
    <button id="btn-qr" onclick="obtenerQR()">Generar Código QR</button>
    <div id="qr-container">
        <p class="status" id="status-text">Haz clic en el botón para solicitar el QR.</p>
    </div>
</div>

<script>
    // URL del servicio activo de Evolution API en Render
    const API_URL = "https://evolution-wilon-api.onrender.com";
    const API_KEY = "42964047a04943399d3ba7e63f92d83e";
    const INSTANCE_NAME = "wilon";

    async function obtenerQR() {
        const btn = document.getElementById("btn-qr");
        const statusText = document.getElementById("status-text");
        const qrContainer = document.getElementById("qr-container");

        btn.disabled = true;
        statusText.innerText = "Conectando con la API y buscando QR...";

        try {
            // 1. Intentar conectar y obtener el QR de la instancia 'wilon'
            let response = await fetch(`${API_URL}/instance/connect/${INSTANCE_NAME}`, {
                method: "GET",
                headers: { "apikey": API_KEY }
            });

            let data = await response.json();

            // 2. Si la instancia no existe, la creamos primero
            if (response.status === 404 || (data.message && data.message.includes("not found"))) {
                statusText.innerText = "Creando instancia por primera vez...";
                await fetch(`${API_URL}/instance/create`, {
                    method: "POST",
                    headers: {
                        "apikey": API_KEY,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        instanceName: INSTANCE_NAME,
                        qrcode: true,
                        integration: "WHATSAPP-BAILEYS"
                    })
                });

                // Volver a consultar conexión tras la creación
                response = await fetch(`${API_URL}/instance/connect/${INSTANCE_NAME}`, {
                    method: "GET",
                    headers: { "apikey": API_KEY }
                });
                data = await response.json();
            }

            // 3. Extraer e imprimir la imagen del QR
            const qrBase64 = data.base64 || data.code || (data.qrcode ? data.qrcode.base64 : null);

            if (qrBase64) {
                const imageSrc = qrBase64.startsWith("data:image") ? qrBase64 : `data:image/png;base64,${qrBase64}`;
                qrContainer.innerHTML = `<img src="${imageSrc}" alt="Código QR WhatsApp"><p class="status">¡Escanea este código desde WhatsApp!</p>`;
            } else if (data.instance?.state === "open") {
                qrContainer.innerHTML = `<p class="status" style="color: #4ade80;">¡WhatsApp ya está VINCULADO y activo! 🎉</p>`;
            } else {
                statusText.innerText = "Cargando código QR... Presiona el botón una vez más.";
            }

        } catch (error) {
            console.error("Error:", error);
            statusText.innerText = "Error al conectar con Evolution API. Reintenta en unos segundos.";
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
