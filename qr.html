<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conectar Wilon a WhatsApp</title>
    <!-- Librería qrcode.js para renderizar el QR si devuelve texto plano -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: #38bdf8;
        }

        button {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
        }

        button:hover {
            background-color: #059669;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #64748b;
            cursor: not-allowed;
        }

        #qrContainer {
            margin-top: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 230px;
        }

        #qrContainer img, #qrContainer canvas {
            border-radius: 8px;
            padding: 10px;
            background-color: white;
        }

        #statusText {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Vinculación Wilon WhatsApp 📲</h1>
        <button id="btnQR" onclick="obtenerQR()">Generar Código QR</button>
        
        <div id="qrContainer"></div>
        <p id="statusText">Haz clic en el botón para solicitar el QR.</p>
    </div>

    <script>
        async function obtenerQR() {
            const btn = document.getElementById('btnQR');
            const statusText = document.getElementById('statusText');
            const qrContainer = document.getElementById('qrContainer');

            btn.disabled = true;
            statusText.innerText = "Consultando API...";
            qrContainer.innerHTML = "";

            try {
                const response = await fetch('https://evolution-wilon-api.onrender.com/instance/connect/wilon', {
                    method: 'GET',
                    headers: {
                        'apikey': '42964047a04943399d3ba7e63f92d83e'
                    }
                });

                const data = await response.json();
                console.log("Respuesta API:", data);

                // Evaluar si la instancia está conectada o devolver QR
                const estado = data.instance?.state || data.state || data.status;

                if (estado === "open") {
                    statusText.innerText = "¡WhatsApp ya está VINCULADO y activo! 🎉";
                } else if (data.base64 || data.code) {
                    statusText.innerText = "¡Escanea este código QR desde WhatsApp!";
                    
                    const qrText = data.code || data.base64;

                    if (qrText.startsWith('data:image')) {
                        // Si ya viene como imagen en Base64
                        const img = document.createElement('img');
                        img.src = qrText;
                        img.width = 230;
                        qrContainer.appendChild(img);
                    } else {
                        // Si viene como texto plano, renderizarlo con qrcode.js
                        new QRCode(qrContainer, {
                            text: qrText,
                            width: 230,
                            height: 230
                        });
                    }
                } else {
                    statusText.innerText = "Estado actual: " + (estado || "Desconocido");
                }

            } catch (error) {
                console.error("Error:", error);
                statusText.innerText = "Error de conexión con la API.";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
