<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conectar Wilon a WhatsApp</title>
    <!-- Librería para convertir texto a QR directamente en el navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h2 { margin-bottom: 1.5rem; color: #38bdf8; }
        button {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }
        button:hover { background-color: #059669; }
        button:disabled { background-color: #64748b; cursor: not-allowed; }
        #qr-container {
            margin-top: 1.5rem;
            min-height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #qrcode img, #qrcode canvas {
            padding: 10px;
            background: white;
            border-radius: 8px;
            border: 4px solid #38bdf8;
        }
        .status { margin-top: 10px; font-size: 0.9rem; color: #94a3b8; }
    </style>
</head>
<body>

<div class="card">
    <h2>Vinculación Wilon WhatsApp 📲</h2>
    <button id="btn-qr" onclick="obtenerQR()">Generar Código QR</button>
    <div id="qr-container">
        <div id="qrcode"></div>
        <p class="status" id="status-text">Haz clic en el botón para solicitar el QR.</p>
    </div>
</div>

<script>
    const API_URL = "https://evolution-wilon-api.onrender.com";
    const API_KEY = "42964047a04943399d3ba7e63f92d83e";
    const INSTANCE_NAME = "wilon";

    async function obtenerQR() {
        const btn = document.getElementById("btn-qr");
        const statusText = document.getElementById("status-text");
        const qrDiv = document.getElementById("qrcode");

        btn.disabled = true;
        qrDiv.innerHTML = "";
        statusText.innerText = "Consultando Evolution API...";

        try {
            // 1. Conectar a la instancia
            let response = await fetch(`${API_URL}/instance/connect/${INSTANCE_NAME}`, {
                method: "GET",
                headers: { "apikey": API_KEY }
            });

            // 2. Si no existe la instancia, la crea automáticamente
            if (response.status === 404) {
                statusText.innerText = "Creando instancia por primera vez...";
                await fetch(`${API_URL}/instance/create`, {
                    method: "POST",
                    headers: {
                        "apikey": API_KEY,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        instanceName: INSTANCE_NAME,
                        qrcode: true,
                        integration: "WHATSAPP-BAILEYS"
                    })
                });

                response = await fetch(`${API_URL}/instance/connect/${INSTANCE_NAME}`, {
                    method: "GET",
                    headers: { "apikey": API_KEY }
                });
            }

            let data = await response.json();
            console.log("Respuesta de API:", data);

            // 3. Buscar el código de texto o imagen
            let qrCodeText = data.code || data.pairingCode || data.base64 || (data.qrcode ? (data.qrcode.code || data.qrcode.base64) : null);

            if (qrCodeText) {
                if (qrCodeText.startsWith("data:image")) {
                    qrDiv.innerHTML = `<img src="${qrCodeText}">`;
                } else {
                    // Convertimos el código de texto en un código QR en pantalla
                    new QRCode(qrDiv, {
                        text: qrCodeText,
                        width: 230,
                        height: 230
                    });
                }
                statusText.innerText = "¡Escanea este código QR desde WhatsApp!";
            } else if (data.instance?.state === "open" || data.status === "open") {
                statusText.innerText = "¡WhatsApp ya está VINCULADO y activo! 🎉";
            } else {
                statusText.innerText = "Cargando sesión... Haz clic en el botón una vez más.";
            }

        } catch (error) {
            console.error("Error:", error);
            statusText.innerText = "Error de conexión con la API.";
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
