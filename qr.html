<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conectar Wilon a WhatsApp</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h2 { margin-bottom: 1.5rem; color: #38bdf8; }
        button {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }
        button:hover { background-color: #059669; }
        button:disabled { background-color: #64748b; cursor: not-allowed; }
        #qr-container {
            margin-top: 1.5rem;
            min-height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        img {
            max-width: 250px;
            border-radius: 8px;
            border: 4px solid #38bdf8;
        }
        .status { margin-top: 10px; font-size: 0.9rem; color: #94a3b8; }
    </style>
</head>
<body>

<div class="card">
    <h2>Vinculación Wilon WhatsApp 📲</h2>
    <button id="btn-qr" onclick="obtenerQR()">Generar Código QR</button>
    <div id="qr-container">
        <p class="status" id="status-text">Haz clic en el botón para solicitar el QR.</p>
    </div>
</div>

<script>
    const API_URL = "https://evolution-wilon-api.onrender.com";
    const API_KEY = "42964047a04943399d3ba7e63f92d83e";
    const INSTANCE_NAME = "wilon";

    async function obtenerQR() {
        const btn = document.getElementById("btn-qr");
        const statusText = document.getElementById("status-text");
        const qrContainer = document.getElementById("qr-container");

        btn.disabled = true;
        statusText.innerText = "Conectando con la API...";

        try {
            // 1. Intentar conectar/obtener QR
            let response = await fetch(`${API_URL}/instance/connect/${INSTANCE_NAME}`, {
                method: "GET",
                headers: { "apikey": API_KEY }
            });

            // Si la instancia no existe, la creamos
            if (response.status === 404) {
                statusText.innerText = "Creando instancia...";
                await fetch(`${API_URL}/instance/create`, {
                    method: "POST",
                    headers: {
                        "apikey": API_KEY,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        instanceName: INSTANCE_NAME,
                        qrcode: true,
                        integration: "WHATSAPP-BAILEYS"
                    })
                });

                // Volver a pedir conexión
                response = await fetch(`${API_URL}/instance/connect/${INSTANCE_NAME}`, {
                    method: "GET",
                    headers: { "apikey": API_KEY }
                });
            }

            let data = await response.json();
            console.log("Respuesta Evolution API:", data);

            // 2. Múltiples comprobaciones para capturar el QR según la respuesta de Evolution API v2
            let qrBase64 = null;

            if (typeof data === "string" && data.startsWith("data:image")) {
                qrBase64 = data;
            } else if (data.base64) {
                qrBase64 = data.base64;
            } else if (data.code) {
                qrBase64 = data.code;
            } else if (data.qrcode && data.qrcode.base64) {
                qrBase64 = data.qrcode.base64;
            } else if (data.qrcode && typeof data.qrcode === "string") {
                qrBase64 = data.qrcode;
            }

            // 3. Renderizar resultado
            if (qrBase64) {
                const imageSrc = qrBase64.startsWith("data:image") ? qrBase64 : `data:image/png;base64,${qrBase64}`;
                qrContainer.innerHTML = `<img src="${imageSrc}" alt="Código QR WhatsApp"><p class="status">¡Escanea este código con WhatsApp!</p>`;
            } else if (data.instance?.state === "open" || data.status === "open") {
                qrContainer.innerHTML = `<p class="status" style="color: #4ade80;">¡El WhatsApp ya está VINCULADO y activo! 🎉</p>`;
            } else {
                statusText.innerText = "Respuesta recibida pero sin imagen. Haz clic nuevamente en 3 segundos.";
            }

        } catch (error) {
            console.error("Error:", error);
            statusText.innerText = "Error al conectar con Evolution API.";
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
